name: PR File Analysis with Codacy API

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  analyze-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED_FILES=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path')
          echo "Changed files: $CHANGED_FILES"
          echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV
          echo "$CHANGED_FILES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Analyze files with your custom linter API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API_URL="https://fee6-154-124-182-81.ngrok-free.app/analyze/code"
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO="${GITHUB_REPOSITORY}"
          COMMIT_ID=$(gh pr view $PR_NUMBER --json commits --jq '.commits[-1].oid')

          for FILE in $CHANGED_FILES; do
            if [ -f "$FILE" ]; then
              echo "Processing file with custom linter: $FILE"
              FILE_CONTENT=$(cat "$FILE" | jq -Rs .)
              JSON_PAYLOAD="{\"code\": $FILE_CONTENT, \"filename\": \"$FILE\"}"
              RESPONSE=$(curl -s -X POST "$API_URL" \
                -H "Content-Type: application/json" \
                -d "$JSON_PAYLOAD")

              echo "API Response for $FILE:"
              echo "$RESPONSE"

              ISSUES=$(echo "$RESPONSE" | jq -r '.issues // []')
              if [[ "$ISSUES" != "[]" && "$ISSUES" != "null" ]]; then
                ISSUE_COUNT=$(echo "$ISSUES" | jq 'length')
                for (( i=0; i<$ISSUE_COUNT; i++ )); do
                  LINE=$(echo "$ISSUES" | jq -r ".[$i].line")
                  MESSAGE=$(echo "$ISSUES" | jq -r ".[$i].message")
                  TYPE=$(echo "$ISSUES" | jq -r ".[$i].type")
                  SOURCE=$(echo "$ISSUES" | jq -r ".[$i].source")
                  COMMENT_BODY="**🔧 Linter - $TYPE** from $SOURCE: $MESSAGE"

                  curl -s -X POST \
                    -H "Authorization: token $GITHUB_TOKEN" \
                    -H "Accept: application/vnd.github.v3+json" \
                    "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/comments" \
                    -d "{
                      \"body\": \"$COMMENT_BODY\",
                      \"commit_id\": \"$COMMIT_ID\",
                      \"path\": \"$FILE\",
                      \"line\": $LINE
                    }"
                done
              fi
            fi
          done

      # Alternative: Déclencher l'analyse Codacy manuellement via API
      - name: Trigger Codacy Analysis via API
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          ORG_NAME=$(echo $REPO | cut -d'/' -f1)
          REPO_NAME=$(echo $REPO | cut -d'/' -f2)
          COMMIT_ID=$(gh pr view ${{ github.event.pull_request.number }} --json commits --jq '.commits[-1].oid')
          
          echo "Triggering Codacy analysis for commit: $COMMIT_ID"
          
          # Déclencher l'analyse
          curl -X POST \
            "https://app.codacy.com/api/v3/analysis/organizations/$ORG_NAME/repositories/$REPO_NAME/commits/$COMMIT_ID/analyze" \
            -H "Accept: application/json" \
            -H "api-token: $CODACY_API_TOKEN" \
            --fail-with-body || echo "Analysis trigger may have failed, but continuing..."

      - name: Wait for Codacy analysis and fetch results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO="${GITHUB_REPOSITORY}"
          COMMIT_ID=$(gh pr view $PR_NUMBER --json commits --jq '.commits[-1].oid')
          ORG_NAME=$(echo $REPO | cut -d'/' -f1)
          REPO_NAME=$(echo $REPO | cut -d'/' -f2)

          echo "Waiting for Codacy analysis to complete..."
          
          # Attendre que l'analyse soit terminée (max 3 minutes)
          for i in {1..6}; do
            echo "Attempt $i/6: Checking analysis status..."
            
            CODACY_STATUS=$(curl -s -X GET \
              "https://app.codacy.com/api/v3/analysis/organizations/$ORG_NAME/repositories/$REPO_NAME/commits/$COMMIT_ID" \
              -H "Accept: application/json" \
              -H "api-token: $CODACY_API_TOKEN")
            
            if [[ $(echo "$CODACY_STATUS" | jq -r '.data') != "null" ]]; then
              echo "Analysis completed, fetching issues..."
              break
            fi
            
            if [ $i -eq 6 ]; then
              echo "Analysis timeout, proceeding with available data..."
            else
              echo "Analysis not ready, waiting 30 seconds..."
              sleep 30
            fi
          done

          # Récupérer les issues
          CODACY_RESPONSE=$(curl -s -X GET \
            "https://app.codacy.com/api/v3/analysis/organizations/$ORG_NAME/repositories/$REPO_NAME/commits/$COMMIT_ID/issues" \
            -H "Accept: application/json" \
            -H "api-token: $CODACY_API_TOKEN")

          echo "Codacy API Response:"
          echo "$CODACY_RESPONSE"

          if [[ $(echo "$CODACY_RESPONSE" | jq -r '.data') != "null" ]] && [[ $(echo "$CODACY_RESPONSE" | jq -r '.data | length') -gt 0 ]]; then
            echo "Processing Codacy issues..."
            echo "$CODACY_RESPONSE" | jq -c '.data[]' | while read -r issue; do
              FILENAME=$(echo "$issue" | jq -r '.filename')
              LINE=$(echo "$issue" | jq -r '.line')
              MESSAGE=$(echo "$issue" | jq -r '.message')
              PATTERN_ID=$(echo "$issue" | jq -r '.patternId')
              CATEGORY=$(echo "$issue" | jq -r '.category')
              LEVEL=$(echo "$issue" | jq -r '.level')

              echo "Checking if $FILENAME is in changed files..."
              if echo "$CHANGED_FILES" | grep -q "$FILENAME"; then
                echo "Posting comment for $FILENAME:$LINE"
                COMMENT_BODY="**📊 Codacy Analysis - ${LEVEL} ${CATEGORY}**\n\n${MESSAGE}\n\n*Pattern*: \`${PATTERN_ID}\`"

                curl -s -X POST \
                  -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/comments" \
                  -d "{
                    \"body\": \"$COMMENT_BODY\",
                    \"commit_id\": \"$COMMIT_ID\",
                    \"path\": \"$FILENAME\",
                    \"line\": $LINE
                  }" || echo "Failed to post comment for $FILENAME:$LINE"
              else
                echo "File $FILENAME not in changed files, skipping..."
              fi
            done
          else
            echo "No Codacy issues found or unable to fetch results"
          fi

      - name: Create consolidated analysis summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO="${GITHUB_REPOSITORY}"
          ORG_NAME=$(echo $REPO | cut -d'/' -f1)
          REPO_NAME=$(echo $REPO | cut -d'/' -f2)
          COMMIT_ID=$(gh pr view $PR_NUMBER --json commits --jq '.commits[-1].oid')

          # Récupérer les statistiques de Codacy
          CODACY_STATS=$(curl -s -X GET \
            "https://app.codacy.com/api/v3/analysis/organizations/$ORG_NAME/repositories/$REPO_NAME/commits/$COMMIT_ID" \
            -H "Accept: application/json" \
            -H "api-token: $CODACY_API_TOKEN")

          GRADE=$(echo "$CODACY_STATS" | jq -r '.data.grade // "N/A"')
          ISSUES_COUNT=$(echo "$CODACY_STATS" | jq -r '.data.issuesCount // 0')

          # Créer le fichier de résumé
          cat > analysis_summary.md << EOL
          # 📋 Code Analysis Summary

          ## Analysis Results
          - 🔧 **Custom Linter**: Analysis completed  
          - 📊 **Codacy**: Grade **${GRADE}** with **${ISSUES_COUNT}** total issues

          ## Changed Files Analyzed
          EOL
          
          # Ajouter les fichiers modifiés
          for FILE in $CHANGED_FILES; do
            echo "- \`${FILE}\`" >> analysis_summary.md
          done
          
          # Ajouter la fin du résumé
          cat >> analysis_summary.md << EOL

          See inline comments for detailed feedback from both analyzers.

          💡 **Note**: Only issues in changed files are commented inline.

          *Automated analysis performed on commit \`${COMMIT_ID:0:8}\`*
          EOL

      - name: Add summary comment to PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: analysis_summary.md
          comment_tag: code-analysis-summary
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}